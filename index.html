<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutura | Fruta të Thata</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

<header>
    <div class="logo">Nutura</div>
    <nav>
        <a href="#">Ballina</a>
        <a href="#">Produktet</a>
        <a href="#">Kontakt</a>
        <a href="#" onclick="openCart()">🛒 (<span id="cartCount">0</span>)</a>
    </nav>
</header>

<section class="hero">
    <h1>Fruta të Thata Premium</h1>
    <p>Produkte natyrale, cilësi e lartë</p>
</section>

<section class="products">
    <h2>Produktet Tona</h2>
    <div id="productGrid" class="product-grid"></div>
</section>

<!-- CART MODAL -->
<div id="cartModal" class="modal">
    <div class="modal-content large">
        <span class="close" onclick="closeCart()">&times;</span>
        <h2>Shporta</h2>
        <div id="cartItems"></div>
        <h3 id="totalPrice"></h3>
        <button onclick="checkout()">Vazhdo me Pagesë</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
