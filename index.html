<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutura | Fruta të Thata</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&family=Playfair+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">Nutura</div>

    <div class="center">
        <h1>Nutura Fruta të Thata</h1>
        <p class="slogan">Shije natyrale • Cilësi Premium</p>
    </div>
</header>

<section class="products">
    <div id="productGrid"></div>
</section>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span onclick="closeModal()" class="close">&times;</span>
        <img id="modalImg">
        <h2 id="modalName"></h2>
        <p id="modalDesc"></p>
        <button onclick="orderNow()">Porosit në WhatsApp</button>
    </div>
</div>

<!-- WHATSAPP -->
<a id="waBtn" target="_blank" class="whatsapp">
    <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
    <span id="phoneText">+355XXXXXXXXX</span>
</a>

<script src="script.js"></script>
</body>
</html>
