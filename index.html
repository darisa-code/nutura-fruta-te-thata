<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUTURA | Fruta të Thata</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <div class="header-left">NUTURA</div>
    <div class="header-center">
        <h1>NUTURA FRUTA TË THATA</h1>
        <p class="slogan">Produkte natyrale dhe të shëndetshme</p>
    </div>
</header>

<section class="products">
    <div id="productGrid"></div>
</section>

<!-- Modal për përshkrim dhe porosi -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <img id="modalImage" src="" alt="">
        <h2 id="modalName"></h2>
        <p id="modalDesc"></p>
        <p id="modalPrice"></p>
        <button onclick="addToCartModal()">Porosit</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
