<!DOCTYPE html>
<html lang="sq">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutura</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&family=Playfair+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">Nutura</div>
    <h1>Nutura Fruta të Thata</h1>
    <p class="slogan">Shije natyrale, cilësi premium</p>
</header>

<div id="grid"></div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span onclick="closeModal()" class="close">&times;</span>
    <img id="mImg">
    <h2 id="mName"></h2>
    <p id="mDesc"></p>
    <h3 id="mPrice"></h3>
    <button onclick="order()">Porosit</button>
  </div>
</div>

<!-- WHATSAPP -->
<a id="waBtn" class="whatsapp" target="_blank">
  <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
  <span id="waNumber">+355XXXXXXXXX</span>
</a>

<script src="script.js"></script>
</body>
</html>
